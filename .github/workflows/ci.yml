name: CI

on: [push]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (excluding model-loading packages not needed for syntax check)
        run: pip install fastapi pydantic

      - name: Check app.py syntax
        run: python -m py_compile app.py

      - name: Check Dockerfile exists
        run: test -f Dockerfile